# TEMPORARY test (branch test/linux-512mb-torch only): do plain PyTorch + Transformers + the real FastAPI app fit
# in Render Free's 512 MB? Each case runs in its own job, in a Docker container with a hard cgroup memory limit
# (swap disabled). Database calls are mocked; nothing is deployed.
name: Torch 512MB check
on:
  push:
    branches: [test/linux-512mb-torch]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: seq_352MB,         models: small, only: "bert,gpt,t5",  seq: 1, limit: 352, cpus: "0.5" }
          - { name: seq_320MB,         models: small, only: "bert,gpt,t5",  seq: 1, limit: 320, cpus: "0.5" }
          - { name: seq_288MB,         models: small, only: "bert,gpt,t5",  seq: 1, limit: 288, cpus: "0.5" }
          - { name: seq_512MB_cpu0.1,  models: small, only: "bert,gpt,t5",  seq: 1, limit: 512, cpus: "0.1" }
          - { name: t5_only_512MB_cpu0.1, models: small, only: "t5",        seq: 1, limit: 512, cpus: "0.1" }
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f linux512/Dockerfile -t trio512 .
      - name: Pre-download checkpoints (not memory-limited)
        run: |
          mkdir -p hf && chmod 777 hf
          docker run --rm -v "$PWD/hf:/hf" trio512 python -c "
          from huggingface_hub import snapshot_download
          for n in ['prajjwal1/bert-small','erwanf/gpt2-mini','t5-small','LaurentBlanc/t5-efficient-mini-finetuned']:
              snapshot_download(n, allow_patterns=['*.json','*.txt','*.safetensors','*.model','pytorch_model.bin'])"
      - name: Run case under ${{ matrix.limit }} MB
        run: |
          set +e
          if [ "${{ matrix.models }}" = small ]; then M='{"bert":"prajjwal1/bert-small","gpt":"erwanf/gpt2-mini","t5":"t5-small"}'
          else M='{"bert":"prajjwal1/bert-small","gpt":"erwanf/gpt2-mini","t5":"LaurentBlanc/t5-efficient-mini-finetuned"}'; fi
          sync; echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null   # this container pays for its own file pages
          timeout 1500 docker run --name trio_case --memory=${{ matrix.limit }}m --memory-swap=${{ matrix.limit }}m --cpus=${{ matrix.cpus }} \
            -v "$PWD/hf:/hf" -e HF_HUB_OFFLINE=1 -e SEQUENTIAL=${{ matrix.seq }} -e CASE_MODELS="$M" trio512 \
            python -m linux512.run_case ${{ matrix.name }} "${{ matrix.only }}" 4 2>&1 | tee out.txt
          echo "docker OOMKilled=$(docker inspect -f '{{.State.OOMKilled}}' trio_case) ExitCode=$(docker inspect -f '{{.State.ExitCode}}' trio_case)" | tee -a out.txt
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = None
          for l in open("out.txt"):
              if l.startswith("RESULT "): r = json.loads(l[7:])
          if r: print(f"**{r['case']}** (limit ${{ matrix.limit }} MB): ok={r['ok']} failed={r['failed']} cgroup_peak={r['cgroup_peak_mb']}MB anon/file_end={r.get('cgroup_end_anon_mb')}/{r.get('cgroup_end_file_mb')} server_HWM={r.get('server_hwm_mb')} oom_kill={r['cgroup_events'].get('oom_kill')} server_died={r['server_died']} warm_ms={r['warm_median_ms']}  first_error={r['first_error']}")
          else: print("**${{ matrix.name }}**: no RESULT line (container killed or timed out)")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "result-${{ matrix.name }}", path: out.txt }
